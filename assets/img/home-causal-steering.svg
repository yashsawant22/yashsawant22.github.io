<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 436" role="img" aria-labelledby="title desc">
  <title id="title">One feature direction turns latent reasoning behavior on</title>
  <desc id="desc">For the same prompt and pre-RL model, reasoning behavior rises from 8 percent without steering to 92 percent when an RL-associated feature direction is added at inference time.</desc>

  <rect width="680" height="436" fill="#f4f1e8"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="1" y="19" fill="#24231f" font-family="Georgia, 'Times New Roman', serif" font-size="21">One direction turns latent reasoning behavior on</text>
    <text x="1" y="42" fill="#6d6a61" font-size="11.5">representative prompt · same pre-RL checkpoint · intervention at inference time</text>

    <rect x="1" y="64" width="678" height="52" rx="3" fill="#eeeadf" stroke="#d8d3c7"/>
    <text x="17" y="84" fill="#8b877e" font-size="9.5" font-weight="600" letter-spacing=".8">PROMPT</text>
    <text x="17" y="104" fill="#3f3d38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">After the rain stopped, the children went outside</text>

    <text x="1" y="147" fill="#8b877e" font-size="9.5" font-weight="600" letter-spacing=".9">CONTROL</text>
    <rect x="1" y="160" width="678" height="93" rx="3" fill="none" stroke="#d8d3c7"/>
    <rect x="17" y="178" width="104" height="42" rx="2" fill="#f4f1e8" stroke="#aaa69c"/>
    <text x="69" y="203" fill="#3f3d38" font-size="11.5" text-anchor="middle">pre-RL model</text>
    <path d="M136 199 H169" fill="none" stroke="#aaa69c"/>
    <path d="M163 194 L170 199 L163 204" fill="none" stroke="#aaa69c"/>
    <text x="185" y="187" fill="#8b877e" font-size="9.5" font-weight="600" letter-spacing=".7">NARRATIVE CONTINUATION</text>
    <text x="185" y="207" fill="#6d6a61" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">“to play. They played for hours,</text>
    <text x="185" y="224" fill="#6d6a61" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5"> laughing and having a great time…”</text>
    <text x="655" y="199" fill="#24231f" font-family="Georgia, 'Times New Roman', serif" font-size="31" text-anchor="end">8%</text>
    <text x="655" y="217" fill="#8b877e" font-size="9.5" text-anchor="end">aggregate reasoning rate</text>

    <text x="1" y="282" fill="#304f70" font-size="9.5" font-weight="600" letter-spacing=".9">CAUSAL INTERVENTION</text>
    <rect x="1" y="295" width="678" height="93" rx="3" fill="#304f70" fill-opacity=".035" stroke="#304f70" stroke-opacity=".55"/>
    <rect x="17" y="313" width="104" height="42" rx="2" fill="#f4f1e8" stroke="#304f70"/>
    <text x="69" y="338" fill="#3f3d38" font-size="11.5" text-anchor="middle">pre-RL model</text>
    <path d="M136 334 H169" fill="none" stroke="#304f70"/>
    <path d="M163 329 L170 334 L163 339" fill="none" stroke="#304f70"/>
    <text x="185" y="316" fill="#304f70" font-size="9.5" font-weight="600" letter-spacing=".7">+ RL-UPWEIGHTED FEATURE DIRECTION</text>
    <text x="185" y="341" fill="#304f70" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">“They each bought 2 more candies…</text>
    <text x="185" y="358" fill="#304f70" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5"> How many total candies…?”</text>
    <text x="655" y="334" fill="#304f70" font-family="Georgia, 'Times New Roman', serif" font-size="31" text-anchor="end">92%</text>
    <text x="655" y="352" fill="#304f70" font-size="9.5" text-anchor="end">aggregate reasoning rate</text>

    <text x="1" y="418" fill="#304f70" font-size="11" font-weight="600">+84 percentage points</text>
    <text x="156" y="418" fill="#8b877e" font-size="11">across the evaluation set · no weight update</text>
  </g>
</svg>
