<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <text x="30" y="30" font-size="20" font-weight="600" fill="#c9770d">Flipping reasoning on in a model that never learned it</text>
  <text x="30" y="52" font-size="13.5" fill="#8a92a1">Same pre-RL checkpoint, same plain prompt. Add a direction read out of RL&#8217;s changes &#8594; it starts doing math.</text>

  <!-- shared prompt -->
  <rect x="30" y="72" width="700" height="40" rx="8" fill="#9aa2b1" fill-opacity="0.12" stroke="#9aa2b1" stroke-opacity="0.4"/>
  <text x="46" y="90" font-size="11.5" fill="#8a92a1">prompt</text>
  <text x="46" y="106" font-size="13.5" font-family="ui-monospace, Menlo, monospace" fill="#5c6473">After the rain stopped, the children went outside</text>

  <!-- OFF panel -->
  <rect x="30" y="140" width="338" height="170" rx="10" fill="#9aa2b1" fill-opacity="0.10" stroke="#9aa2b1" stroke-opacity="0.45"/>
  <circle cx="52" cy="164" r="6" fill="#9aa2b1"/>
  <text x="66" y="168" font-size="13" font-weight="600" fill="#5c6473">steering OFF</text>
  <text x="348" y="168" font-size="12" fill="#9aa2b1" text-anchor="end">reasoning: 8%</text>
  <text x="48" y="200" font-size="13.5" font-family="ui-monospace, Menlo, monospace" fill="#5c6473">to play. They played for hours,</text>
  <text x="48" y="220" font-size="13.5" font-family="ui-monospace, Menlo, monospace" fill="#5c6473">laughing and having a great time.</text>
  <text x="48" y="240" font-size="13.5" font-family="ui-monospace, Menlo, monospace" fill="#5c6473">After they were tired, they sat</text>
  <text x="48" y="260" font-size="13.5" font-family="ui-monospace, Menlo, monospace" fill="#5c6473">down on&#8230;</text>

  <!-- arrow / knob -->
  <text x="399" y="220" font-size="26" fill="#5b63d6" text-anchor="middle">&#8594;</text>
  <text x="399" y="245" font-size="10.5" fill="#8a92a1" text-anchor="middle">+ RL&#8217;s</text>
  <text x="399" y="258" font-size="10.5" fill="#8a92a1" text-anchor="middle">reasoning</text>
  <text x="399" y="271" font-size="10.5" fill="#8a92a1" text-anchor="middle">features</text>

  <!-- ON panel -->
  <rect x="430" y="140" width="300" height="170" rx="10" fill="#5b63d6" fill-opacity="0.10" stroke="#5b63d6" stroke-opacity="0.55"/>
  <circle cx="452" cy="164" r="6" fill="#5b63d6"/>
  <text x="466" y="168" font-size="13" font-weight="600" fill="#5b63d6">steering ON</text>
  <text x="710" y="168" font-size="12" fill="#5b63d6" text-anchor="end">reasoning: 92%</text>
  <!-- reasoning-text highlight (matches the inline example) -->
  <g fill="#5b63d6" fill-opacity="0.18">
    <rect x="520" y="189" width="190" height="16" rx="3"/>
    <rect x="446" y="209" width="262" height="16" rx="3"/>
    <rect x="446" y="229" width="230" height="16" rx="3"/>
    <rect x="446" y="249" width="157" height="16" rx="3"/>
  </g>
  <text x="448" y="200" font-size="13.5" font-family="ui-monospace, Menlo, monospace" fill="#5c6473">to play. They each bought 2 more</text>
  <text x="448" y="220" font-size="13.5" font-family="ui-monospace, Menlo, monospace" fill="#5c6473">candies than the total number of</text>
  <text x="448" y="240" font-size="13.5" font-family="ui-monospace, Menlo, monospace" fill="#5c6473">candies they had before. How</text>
  <text x="448" y="260" font-size="13.5" font-family="ui-monospace, Menlo, monospace" fill="#5c6473">many total candies&#8230;</text>
</svg>
