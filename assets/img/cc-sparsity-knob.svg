<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <text x="60" y="30" font-size="21" font-weight="600" fill="#c9770d">The sparsity knob that did nothing</text>
  <text x="60" y="52" font-size="13.5" fill="#8a92a1">Active features per token (L0). L1&#8217;s coefficient swept 60&#215; barely moves it; TopK just sets it.</text>

  <!-- gridlines -->
  <g stroke="#9aa2b1" stroke-opacity="0.30" stroke-width="1">
    <line x1="70" y1="80" x2="690" y2="80"/>
    <line x1="70" y1="150" x2="690" y2="150"/>
    <line x1="70" y1="220" x2="690" y2="220"/>
    <line x1="70" y1="290" x2="690" y2="290"/>
  </g>
  <line x1="70" y1="360" x2="690" y2="360" stroke="#8a92a1" stroke-width="1.2"/>

  <!-- y labels (L0) -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#8a92a1" text-anchor="end">
    <text x="60" y="84">2400</text>
    <text x="60" y="154">1800</text>
    <text x="60" y="224">1200</text>
    <text x="60" y="294">600</text>
    <text x="60" y="364">0</text>
  </g>
  <text x="24" y="220" font-size="12.5" fill="#8a92a1" text-anchor="middle" transform="rotate(-90 24 220)">L0 (active features / token)</text>

  <!-- target band -->
  <rect x="70" y="349" width="620" height="12" fill="#5b63d6" fill-opacity="0.10"/>
  <text x="74" y="343" font-size="11.5" fill="#8a92a1">sparse &amp; interpretable target (a few dozen)</text>

  <!-- L1 cluster (stuck high) -->
  <g fill="#b25478">
    <circle cx="150" cy="157" r="5"/>
    <circle cx="205" cy="129" r="5"/>
    <circle cx="260" cy="113" r="5"/>
    <circle cx="315" cy="102" r="5"/>
    <circle cx="365" cy="95" r="5"/>
  </g>
  <text x="255" y="196" font-size="13" font-weight="600" fill="#b25478" text-anchor="middle">L1, &#955; swept 60&#215;</text>
  <text x="255" y="214" font-size="11.5" fill="#8a92a1" text-anchor="middle">L0 stuck ~1,741&#8211;2,271 &#183; ~22% dead</text>

  <!-- TopK dots on the floor -->
  <g fill="#5b63d6">
    <circle cx="480" cy="358" r="5"/>
    <circle cx="550" cy="356" r="5"/>
    <circle cx="620" cy="353" r="5"/>
  </g>
  <text x="550" y="330" font-size="13" font-weight="600" fill="#5b63d6" text-anchor="middle">TopK, k set</text>
  <text x="550" y="346" font-size="11.5" fill="#8a92a1" text-anchor="middle">L0 = 16 / 32 / 64 exactly</text>

  <!-- the gap arrow -->
  <line x1="400" y1="110" x2="400" y2="344" stroke="#8a92a1" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="410" y="240" font-size="11.5" fill="#8a92a1">the gap between</text>
  <text x="410" y="256" font-size="11.5" fill="#8a92a1">what you asked for</text>
  <text x="410" y="272" font-size="11.5" fill="#8a92a1">and what you got</text>

  <!-- legend -->
  <g font-size="13" fill="#5c6473">
    <circle cx="80" cy="432" r="6" fill="#b25478"/>
    <text x="94" y="436">L1 penalty (5 coefficients, 60&#215; range)</text>
    <circle cx="360" cy="432" r="6" fill="#5b63d6"/>
    <text x="374" y="436">TopK (k = 16 / 32 / 64)</text>
  </g>
</svg>
