<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <text x="30" y="30" font-size="20" font-weight="600" fill="#c9770d">A crosscoder is an SAE plus one change</text>
  <text x="30" y="52" font-size="13.5" fill="#8a92a1">Same encode-up / decode-down shape. The only difference: a second decoder, and the decoders left free.</text>

  <!-- ===== SAE (left) ===== -->
  <text x="40" y="86" font-size="14" font-weight="600" fill="#5c6473">plain SAE (one model)</text>
  <rect x="30" y="100" width="330" height="250" rx="10" fill="#9aa2b1" fill-opacity="0.07" stroke="#9aa2b1" stroke-opacity="0.4"/>

  <rect x="55" y="150" width="80" height="34" rx="6" fill="#9aa2b1" fill-opacity="0.18" stroke="#9aa2b1" stroke-opacity="0.6"/>
  <text x="95" y="171" font-size="12" fill="#5c6473" text-anchor="middle">x</text>
  <line x1="135" y1="167" x2="170" y2="167" stroke="#8a92a1" stroke-width="1.6"/>
  <rect x="170" y="145" width="70" height="44" rx="6" fill="#c9770d" fill-opacity="0.12" stroke="#c9770d" stroke-opacity="0.55"/>
  <text x="205" y="164" font-size="11.5" fill="#c9770d" text-anchor="middle">encoder</text>
  <text x="205" y="179" font-size="10" fill="#8a92a1" text-anchor="middle">ReLU</text>
  <line x1="240" y1="167" x2="275" y2="167" stroke="#8a92a1" stroke-width="1.6"/>
  <rect x="275" y="150" width="70" height="34" rx="6" fill="none" stroke="#9aa2b1" stroke-opacity="0.6"/>
  <text x="310" y="171" font-size="11.5" fill="#5c6473" text-anchor="middle">decoder</text>
  <line x1="310" y1="184" x2="310" y2="215" stroke="#8a92a1" stroke-width="1.6"/>
  <text x="310" y="232" font-size="11.5" fill="#5c6473" text-anchor="middle">x&#770;</text>

  <text x="195" y="290" font-size="11.5" fill="#8a92a1" text-anchor="middle">decoder columns unit-normed</text>
  <text x="195" y="308" font-size="11.5" fill="#8a92a1" text-anchor="middle">&#8594; |f| is real usage</text>
  <text x="195" y="330" font-size="12" font-weight="600" fill="#5c6473" text-anchor="middle">sparsity: L1 penalty works</text>

  <!-- ===== Crosscoder (right) ===== -->
  <text x="410" y="86" font-size="14" font-weight="600" fill="#5b63d6">crosscoder (two models)</text>
  <rect x="400" y="100" width="330" height="250" rx="10" fill="#5b63d6" fill-opacity="0.06" stroke="#5b63d6" stroke-opacity="0.5"/>

  <rect x="420" y="140" width="78" height="30" rx="6" fill="#9aa2b1" fill-opacity="0.18" stroke="#9aa2b1" stroke-opacity="0.6"/>
  <text x="459" y="159" font-size="11" fill="#5c6473" text-anchor="middle">x (DPO)</text>
  <rect x="420" y="196" width="78" height="30" rx="6" fill="#5b63d6" fill-opacity="0.14" stroke="#5b63d6" stroke-opacity="0.55"/>
  <text x="459" y="215" font-size="11" fill="#5b63d6" text-anchor="middle">x (RLVR1)</text>

  <line x1="498" y1="155" x2="533" y2="176" stroke="#8a92a1" stroke-width="1.6"/>
  <line x1="498" y1="211" x2="533" y2="190" stroke="#8a92a1" stroke-width="1.6"/>
  <rect x="533" y="160" width="72" height="46" rx="6" fill="#c9770d" fill-opacity="0.12" stroke="#c9770d" stroke-opacity="0.55"/>
  <text x="569" y="180" font-size="11" fill="#c9770d" text-anchor="middle">shared</text>
  <text x="569" y="195" font-size="11" fill="#c9770d" text-anchor="middle">encoder</text>

  <line x1="605" y1="176" x2="640" y2="155" stroke="#9aa2b1" stroke-width="1.6"/>
  <line x1="605" y1="190" x2="640" y2="211" stroke="#5b63d6" stroke-width="1.6"/>
  <rect x="640" y="140" width="70" height="30" rx="6" fill="none" stroke="#9aa2b1" stroke-opacity="0.6"/>
  <text x="675" y="159" font-size="10.5" fill="#5c6473" text-anchor="middle">decoder&#8320;</text>
  <rect x="640" y="196" width="70" height="30" rx="6" fill="none" stroke="#5b63d6" stroke-opacity="0.6"/>
  <text x="675" y="215" font-size="10.5" fill="#5b63d6" text-anchor="middle">decoder&#8321;</text>

  <text x="565" y="290" font-size="11.5" fill="#8a92a1" text-anchor="middle">decoders left free</text>
  <text x="565" y="308" font-size="11.5" fill="#8a92a1" text-anchor="middle">&#8594; their norms are the signal</text>
  <text x="565" y="330" font-size="12" font-weight="600" fill="#5b63d6" text-anchor="middle">sparsity: L1 breaks &#8594; TopK</text>

  <!-- the one-change callout -->
  <text x="380" y="378" font-size="12.5" fill="#8a92a1" text-anchor="middle">the same free decoders that let you measure per-model usage are what kill the L1 knob</text>
</svg>
